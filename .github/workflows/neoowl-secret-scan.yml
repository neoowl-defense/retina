name: neoowl-secret-scan
# Secret-scanning gate. Scans only the commits a push/PR introduces (not full
# history), so pre-existing history never blocks work — but a newly committed
# secret fails the check. gitleaks CLI: no license required. Respects this
# repo's .gitleaks.toml allowlist and .gitleaksignore baseline automatically.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_PR_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          C="--redact --no-banner --exit-code 1"
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning PR range ${BASE_SHA}..${HEAD_PR_SHA}"
            gitleaks detect --source . $C --log-opts="${BASE_SHA}..${HEAD_PR_SHA}"
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: scanning latest commit only"
            gitleaks detect --source . $C --log-opts="-1 ${HEAD_SHA}"
          else
            echo "Scanning push range ${BEFORE}..${HEAD_SHA}"
            gitleaks detect --source . $C --log-opts="${BEFORE}..${HEAD_SHA}"
          fi
